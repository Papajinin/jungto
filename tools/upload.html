<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jungto 강의 올리기</title>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; background: #F7F3EA; color: #2B2620; max-width: 520px; margin: 0 auto; padding: 24px 16px; line-height: 1.6; }
    h1 { font-size: 22px; }
    button { font: inherit; font-weight: 700; border-radius: 10px; padding: 12px 16px; border: 0; background: #8A5A2B; color: #FFF8EE; cursor: pointer; margin: 4px 0; }
    #log { white-space: pre-wrap; background: #FFFDF8; border: 1px solid #E4DCCC; border-radius: 10px; padding: 12px; margin-top: 16px; font-size: 14px; min-height: 60px; }
    code { background: #EDE3D3; padding: 0 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- 맥에서 만든 data/out/NN.json을 Firebase(lectures/NN, meta/bigpicture)에 올리는 화면 -->
  <h1>Jungto 강의 올리기</h1>
  <p>맥에서 <code>http://localhost:8790/tools/upload.html</code>로 열고 1) 로그인 → 2) 올리기.<br>
    맥의 <b>data/out 폴더</b>에 있는 강의를 모두 찾아서 올려요. 같은 강의를 다시 올리면 새 것으로 바뀌어요.</p>
  <button id="login" type="button">구글로 로그인</button>
  <div id="step2" hidden><button id="send" type="button">맥에 있는 강의 모두 올리기</button></div>
  <div id="log">로그인해 주세요.</div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../sync-config.js"></script>
  <script>
    const log = t => { document.getElementById('log').textContent = t; };
    if (!FIREBASE_CONFIG.apiKey) log('아직 Firebase가 연결되지 않았어요 (sync-config.js).');
    else {
      firebase.initializeApp(FIREBASE_CONFIG);
      const auth = firebase.auth(), db = firebase.firestore();
      db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
      document.getElementById('login').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => log('로그인 실패: ' + e.code));
      auth.onAuthStateChanged(u => {
        document.getElementById('step2').hidden = !u;
        if (u) log(`${u.email}로 로그인했어요. 올리기를 눌러 주세요.`);
      });
      const withTimeout = p => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('30초 안에 끝나지 않았어요 (인터넷 연결 확인)')), 30000))]);
      document.getElementById('send').onclick = async () => {
        log('맥에서 강의 파일을 찾는 중…');
        const out = [];
        for (let n = 1; n <= 40; n++) {
          const id = String(n).padStart(2, '0');
          const r = await fetch(`../data/out/${id}.json`, { cache: 'no-store' }).catch(() => null);
          if (!r || !r.ok) continue;
          try {
            const d = await r.json();
            await withTimeout(db.collection('lectures').doc(id).set(d));
            out.push(`✅ ${n}강 ${d.title}`);
          } catch (e) {
            out.push(`❌ ${n}강: ${e.code === 'permission-denied' ? '이 계정은 올릴 수 없어요' : e.message}`);
          }
          log(out.join('\n'));
        }
        const b = await fetch('../data/out/bigpicture.json', { cache: 'no-store' }).catch(() => null);
        if (b && b.ok) {
          try { await withTimeout(db.collection('meta').doc('bigpicture').set(await b.json())); out.push('✅ 큰 그림'); }
          catch (e) { out.push('❌ 큰 그림: ' + e.message); }
        }
        log(out.length ? out.join('\n') + '\n\n끝났어요. 폰에서 앱을 다시 열면 보여요.' : '맥의 data/out 폴더에서 강의 파일을 찾지 못했어요.');
      };
    }
  </script>
</body>
</html>
